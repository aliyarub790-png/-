name: Build Arabic Alphabet Game APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/yarub/game
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets

          unzip -q arabic-alphabet-game.zip -d game

          HTML_FILE=$(find game -type f -iname "index.html" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "index.html not found"
            exit 1
          fi

          GAME_DIR=$(dirname "$HTML_FILE")
          cp -r "$GAME_DIR"/. android/app/src/main/assets/

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "ArabicAlphabetGame"
include ":app"
EOF

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.3' apply false
}
EOF

          cat > android/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yarub.game'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yarub.game'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}
EOF

          cat > android/src_dummy.txt <<'EOF'
EOF

          cat > android/app/src/main/res/values/styles.xml <<'EOF'
<resources>
    <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
        <item name="android:fontFamily">sans</item>
        <item name="android:colorAccent">#6750A4</item>
    </style>
</resources>
EOF

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET" />

    <application
        android:theme="@style/AppTheme"
        android:label="
