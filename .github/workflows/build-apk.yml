name: Build Arabic Alphabet Game APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract game ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p game
          unzip -q "$ZIP_FILE" -d game

      - name: Find HTML file
        run: |
          HTML_FILE=$(find game -type f -iname "index.html" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "index.html not found"
            echo "Files found:"
            find game -type f
            exit 1
          fi

          echo "HTML file found: $HTML_FILE"
          echo "HTML_FILE=$HTML_FILE" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/yarub/arabicalphabet
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          GAME_DIR=$(dirname "$HTML_FILE")

          cp -r "$GAME_DIR"/. android/app/src/main/assets/

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ArabicAlphabetGame"
          include ":app"
          EOF

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.yarub.arabicalphabet'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.yarub.arabicalphabet'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Arabic Alphabet Game</string>
          </resources>
          EOF

         
